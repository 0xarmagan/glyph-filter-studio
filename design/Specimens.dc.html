<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lines and figures</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1640px; height: 1080px; box-sizing: border-box; padding: 56px 64px; display: flex; flex-direction: column; gap: 36px; background-color: #0a0a0a; background-image: linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px); background-size: 42px 42px; color: #ffffff; font-family: 'Suisse Intl', system-ui, -apple-system, 'Segoe UI', sans-serif">
<div style="display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; line-height: 1.4; letter-spacing: 0.1em; color: #9aa3b3">[ FIGURES ]</p>
<h1 style="margin: 0; font-size: 44px; line-height: 1.1; font-weight: 700">Lines <span style="font-weight: 300; color: #d8d8d8">and separate figures</span></h1>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{figures}}" as="item" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="width: 360px; height: 360px; box-sizing: border-box; border: 1px solid #2e2e2e; border-radius: 16px; overflow: hidden; background: #000000">
<dc-import name="Figure" shape="{{item.shape}}" size="{{item.size}}" seed="{{item.seed}}" cell="{{item.cell}}" palette="{{palette}}" hint-size="358px,358px"></dc-import>
</div>
<p style="margin: 0; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.1em; color: #9aa3b3">{{item.label}}</p>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["electric","brand","mono"],"default":"electric"},"$preview":{"width":1640,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var list = ['line', 'lines', 'triangle', 'square', 'circle', 'hexagon', 'diamond', 'cube'];
    return {
      palette: this.props.palette || 'electric',
      figures: list.map(function (s, i) {
        return { shape: s, size: 358, cell: 7, seed: 11 + i * 17, label: ('0' + (i + 1)).slice(-2) + '  ' + s.toUpperCase() };
      })
    };
  }
}
</script>
</body>
</html>
