<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Partner banner with glyph divider</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1600px; height: 840px; position: relative; overflow: hidden; background: linear-gradient(180deg, #0c0c0e 0%, #11101c 30%, #1b1745 62%, #2b2478 100%); color: #ffffff; font-family: 'Suisse Intl', system-ui, -apple-system, 'Segoe UI', sans-serif">
<div style="position: absolute; left: 160px; top: 300px; width: 520px; height: 240px; box-sizing: border-box; border: 1px dashed #2e2e2e; border-radius: 16px; display: flex; align-items: center; justify-content: center">
<p style="margin: 0; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; letter-spacing: 0.1em; color: #9aa3b3">[ EEZ LOGO ]</p>
</div>
<div style="position: absolute; left: 740px; top: 180px; width: 120px; height: 480px">
<dc-import name="Figure" shape="vbar" size="{{vw}}" height="{{vh}}" clear="{{clear}}" palette="{{palette}}" light="{{light}}" weight="{{weight}}" halo="{{halo}}" glow="{{glow}}" warp="{{warp}}" seed="{{seed}}" cell="{{cell}}" hint-size="120px,480px"></dc-import>
</div>
<div style="position: absolute; left: 920px; top: 300px; width: 520px; height: 240px; box-sizing: border-box; border: 1px dashed #2e2e2e; border-radius: 16px; display: flex; align-items: center; justify-content: center">
<p style="margin: 0; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; letter-spacing: 0.1em; color: #9aa3b3">[ PARTNER LOGO ]</p>
</div>
<sc-if value="{{rule}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 0px; top: 710px; width: 1600px; height: 60px">
<dc-import name="Figure" shape="hbar" size="{{hw}}" height="{{hh}}" clear="{{clear}}" palette="{{palette}}" light="{{light}}" weight="{{ruleWeight}}" halo="{{ruleHalo}}" glow="{{ruleGlow}}" warp="{{warp}}" seed="{{seed}}" cell="{{cell}}" hint-size="1600px,60px"></dc-import>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["brand","electric","mono"],"default":"brand","section":"Divider"},"light":{"editor":"range","min":0,"max":360,"step":5,"default":270,"unit":"deg","section":"Divider"},"weight":{"editor":"range","min":0.4,"max":2,"step":0.05,"default":0.9,"section":"Divider"},"glow":{"editor":"range","min":0,"max":1,"step":0.05,"default":0.5,"section":"Divider"},"halo":{"editor":"range","min":0,"max":1,"step":0.05,"default":0.5,"section":"Divider"},"rule":{"editor":"boolean","default":true,"section":"Bottom rule"},"$preview":{"width":1600,"height":840}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props, n = function (v, d) { var x = Number(v); return v !== undefined && v !== null && v !== '' && isFinite(x) ? x : d; };
    return {
      clear: true, cell: 9, seed: 7, warp: 0.4,
      vw: 120, vh: 480, hw: 1600, hh: 60,
      palette: p.palette || 'brand',
      light: n(p.light, 270),
      weight: n(p.weight, 0.9),
      glow: n(p.glow, 0.5),
      halo: n(p.halo, 0.5),
      rule: p.rule === undefined ? true : (p.rule === true || p.rule === 'true'),
      ruleWeight: 0.6, ruleHalo: 0.25, ruleGlow: 0.35
    };
  }
}
</script>
</body>
</html>
